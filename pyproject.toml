[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rusa-ai"
version = "0.2.0"
description = "RUSA-AI model serving and autonomous coding-agent platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100,<1",
  "uvicorn[standard]>=0.22,<1",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.17,<5",
  "httpx>=0.24,<1",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.1,<4",
  "prometheus-client>=0.20,<1",
]

[project.scripts]
rusa-knowledge = "rusa_knowledge.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.3,<10",
  "pytest-asyncio>=0.21,<2",
  "ruff>=0.6,<1",
  "bandit>=1.7,<2",
]
model = [
  "torch>=2.2,<3",
  "transformers>=5.10.0,<6",
  "accelerate>=1.0,<2",
  "safetensors>=0.4.5,<1",
]
vllm = ["vllm>=0.32,<0.33"]

[tool.setuptools.packages.find]
include = ["rusa_agents*", "rusa_knowledge*"]

[tool.setuptools.package-data]
"rusa_agents.devops" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
