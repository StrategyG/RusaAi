[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rusa-ai"
version = "0.3.0"
description = "RUSA-AI model serving and enterprise coding-agent runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
model = [
  "torch>=2.6.0,<3",
  "transformers==5.22.1",
  "safetensors>=0.4.5,<1",
  "accelerate>=1.0,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
  "bandit>=1.7,<2",
]

[tool.setuptools.packages.find]
include = ["rusa_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
