services:
  api:
    image: ${RUSA_API_IMAGE:?Set RUSA_API_IMAGE to an immutable API image digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ENVIRONMENT: production
      RUSA_API_DATABASE_URL: ${RUSA_API_DATABASE_URL:?Set the API PostgreSQL login DSN}
      RUSA_WORKER_DATABASE_URL: ""
      RUSA_DATABASE_URL: ""
      RUSA_API_KEY: ""
      RUSA_API_KEYS: "{}"
      RUSA_API_KEYS_JSON: ${RUSA_API_KEYS_JSON:?Set the SHA-256 tenant API key registry}
      RUSA_AUDIT_HMAC_KEY: ""
      RUSA_GITHUB_TOKEN: ""
      RUSA_SANDBOX_IMAGE: ""
      RUSA_WORKSPACE_ROOT: ""
      RUSA_GIT_MIRROR_ROOT: ""
      RUSA_DOCKER_SOCKET: ""
      RUSA_DOCKER_GID: ""
      POSTGRES_PASSWORD: ""
      RUSA_AICODE_ENABLED: ${RUSA_AICODE_ENABLED:-false}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [rusa-internal, rusa-egress]

  worker:
    image: ${RUSA_WORKER_IMAGE:?Set RUSA_WORKER_IMAGE to an immutable worker image digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    command: ["python", "-m", "rusa_agents.worker_main"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      RUSA_WORKER_DATABASE_URL: ${RUSA_WORKER_DATABASE_URL:?Set the worker PostgreSQL login DSN}
      RUSA_API_DATABASE_URL: ""
      RUSA_DATABASE_URL: ""
      RUSA_API_KEY: ""
      RUSA_API_KEYS: "{}"
      RUSA_API_KEYS_JSON: "{}"
      RUSA_METRICS_API_KEY: ""
      POSTGRES_PASSWORD: ""
      RUSA_AICODE_ENABLED: ${RUSA_AICODE_ENABLED:-false}
      DOCKER_HOST: unix:///run/docker.sock
      RUSA_METRICS_BIND: 0.0.0.0
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    volumes:
      - ${RUSA_DOCKER_SOCKET:?Set a dedicated rootless Docker socket}:/run/docker.sock
      - ${RUSA_WORKSPACE_ROOT:?Set RUSA_WORKSPACE_ROOT}:${RUSA_WORKSPACE_ROOT}
      - ${RUSA_GIT_MIRROR_ROOT:?Set RUSA_GIT_MIRROR_ROOT}:${RUSA_GIT_MIRROR_ROOT}
    group_add:
      - "${RUSA_DOCKER_GID:?Set the rootless Docker socket GID}"
    expose:
      - "9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [rusa-internal, rusa-egress]

  grpc-orchestrator:
    image: ${RUSA_API_IMAGE:?Set RUSA_API_IMAGE to an immutable API image digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    command: ["python", "-m", "rusa_agents.devops.grpc_server"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      RUSA_GRPC_PROFILE: orchestrator
      RUSA_GRPC_BIND_ADDRESS: 0.0.0.0:7443
      RUSA_GRPC_TRUST_DOMAIN: ${RUSA_GRPC_TRUST_DOMAIN:-rusa.ai}
      RUSA_API_DATABASE_URL: ${RUSA_API_DATABASE_URL:?Set the API PostgreSQL login DSN}
      RUSA_WORKER_DATABASE_URL: ""
      RUSA_GRPC_SERVER_CERT_FILE: /run/secrets/rusa_grpc_server_cert
      RUSA_GRPC_SERVER_KEY_FILE: /run/secrets/rusa_grpc_server_key
      RUSA_GRPC_CLIENT_CA_FILE: /run/secrets/rusa_grpc_client_ca
      RUSA_GRPC_RPC_TIMEOUT_SECONDS: "2"
      RUSA_GRPC_STATEMENT_TIMEOUT_MS: "2000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    expose: ["7443"]
    secrets:
      - rusa_grpc_server_cert
      - rusa_grpc_server_key
      - rusa_grpc_client_ca
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',7443),timeout=2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [rusa-internal]

  grpc-workers:
    image: ${RUSA_API_IMAGE:?Set RUSA_API_IMAGE to an immutable API image digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    command: ["python", "-m", "rusa_agents.devops.grpc_server"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      RUSA_GRPC_PROFILE: workers
      RUSA_GRPC_BIND_ADDRESS: 0.0.0.0:7443
      RUSA_GRPC_TRUST_DOMAIN: ${RUSA_GRPC_TRUST_DOMAIN:-rusa.ai}
      RUSA_API_DATABASE_URL: ""
      RUSA_WORKER_DATABASE_URL: ${RUSA_WORKER_DATABASE_URL:?Set the worker PostgreSQL login DSN}
      RUSA_GRPC_SERVER_CERT_FILE: /run/secrets/rusa_grpc_server_cert
      RUSA_GRPC_SERVER_KEY_FILE: /run/secrets/rusa_grpc_server_key
      RUSA_GRPC_CLIENT_CA_FILE: /run/secrets/rusa_grpc_client_ca
      RUSA_GRPC_RPC_TIMEOUT_SECONDS: "2"
      RUSA_GRPC_STATEMENT_TIMEOUT_MS: "2000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    expose: ["7443"]
    secrets:
      - rusa_grpc_server_cert
      - rusa_grpc_server_key
      - rusa_grpc_client_ca
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',7443),timeout=2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [rusa-internal]

networks:
  rusa-internal:
    driver: bridge
    internal: true
  rusa-egress:
    driver: bridge

secrets:
  rusa_grpc_server_cert:
    file: ${RUSA_GRPC_SERVER_CERT_FILE:?Set the gRPC server certificate PEM path}
  rusa_grpc_server_key:
    file: ${RUSA_GRPC_SERVER_KEY_FILE:?Set the gRPC server private key PEM path}
  rusa_grpc_client_ca:
    file: ${RUSA_GRPC_CLIENT_CA_FILE:?Set the gRPC client CA bundle PEM path}
