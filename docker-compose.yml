services:
  rusa-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rusa-ai:local
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "${RUSA_BIND_ADDRESS:-127.0.0.1}:${RUSA_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      RUSA_API_KEY: ${RUSA_API_KEY:?Set RUSA_API_KEY in .env}
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-ai-v1}
      RUSA_MODEL_PATH: /models
      RUSA_MAX_REQUEST_BYTES: ${RUSA_MAX_REQUEST_BYTES:-1048576}
      TASK_ENVELOPE_SCHEMA_PATH: /app/schemas/a2a/task-envelope.schema.json
      RUSA_AUTH_ENABLED: ${RUSA_AUTH_ENABLED:-true}
      RUSA_AUTH_SECRET: ${RUSA_AUTH_SECRET:?Set RUSA_AUTH_SECRET in .env}
      RUSA_AUTH_SCHEMA_MANAGED_EXTERNALLY: "true"
      RUSA_BOOTSTRAP_ADMIN_EMAIL: ${RUSA_BOOTSTRAP_ADMIN_EMAIL:?Set RUSA_BOOTSTRAP_ADMIN_EMAIL in .env}
      RUSA_BOOTSTRAP_ADMIN_PASSWORD: ${RUSA_BOOTSTRAP_ADMIN_PASSWORD:?Set RUSA_BOOTSTRAP_ADMIN_PASSWORD in .env}
      RUSA_BOOTSTRAP_ADMIN_TENANT_ID: ${RUSA_BOOTSTRAP_ADMIN_TENANT_ID:-tenant-a}
      RUSA_TENANT_ID: ${RUSA_TENANT_ID:-tenant-a}
      RUSA_COOKIE_SECURE: ${RUSA_COOKIE_SECURE:-true}
      RUSA_AGENT_ENABLED: ${RUSA_AGENT_ENABLED:-false}
      RUSA_AGENT_MAX_OUTSTANDING_PER_TENANT: ${RUSA_AGENT_MAX_OUTSTANDING_PER_TENANT:-1000}
      RUSA_RAG_ENABLED: ${RUSA_RAG_ENABLED:-false}
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_agent_api:${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD in .env}@rusa-agent-db:5432/rusa_agent
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-text-embedding-3-small}
      RUSA_KNOWLEDGE_COLLECTION: ${RUSA_KNOWLEDGE_COLLECTION:-agent}
      DATABASE_URL: postgresql://rusa_web_api:${RUSA_WEB_DB_PASSWORD:?Set RUSA_WEB_DB_PASSWORD in .env}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_API_DATABASE_URL: postgresql://rusa_agent_api:${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD in .env}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_AUDIT_KEY: ${RUSA_AGENT_AUDIT_KEY:?Set RUSA_AGENT_AUDIT_KEY in .env}
      RUSA_AGENT_AUDIT_PATH: /var/lib/rusa-agent/api-audit.jsonl
    volumes:
      - rusa-agent-audit-data:/var/lib/rusa-agent
      - type: bind
        source: ${RUSA_MODEL_DIR:?Set RUSA_MODEL_DIR in .env}
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: rusa-ai-web:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RUSA_WEB_PORT:-3000}:8080"
    depends_on:
      rusa-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: rusa_agent
      POSTGRES_USER: rusa_agent_owner
      POSTGRES_PASSWORD: ${RUSA_AGENT_DB_PASSWORD:?Set RUSA_AGENT_DB_PASSWORD in .env}
      RUSA_AGENT_WORKER_DB_PASSWORD: ${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD in .env}
      RUSA_AGENT_API_DB_PASSWORD: ${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD in .env}
      RUSA_WEB_DB_PASSWORD: ${RUSA_WEB_DB_PASSWORD:?Set RUSA_WEB_DB_PASSWORD in .env}
    volumes:
      - rusa-agent-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init-agent-db.sh:/docker-entrypoint-initdb.d/10-init-agent-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rusa_agent_owner -d rusa_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  rusa-agent-migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rusa-agent-runtime:local
    command:
      - python
      - -c
      - |
        import os
        from pathlib import Path
        import psycopg
        from psycopg import sql
        from rusa_agents.memory import PostgresMemoryStore
        from rusa_agents.queue import PostgresTaskQueue
        owner_dsn = os.environ["RUSA_AGENT_OWNER_DATABASE_URL"]
        with psycopg.connect(owner_dsn) as connection:
            connection.execute("REVOKE CREATE ON SCHEMA public FROM PUBLIC")
            connection.execute("REVOKE CREATE ON SCHEMA public FROM rusa_agent_api")
            connection.execute("GRANT USAGE ON SCHEMA public TO rusa_agent_api")
            connection.execute("GRANT USAGE, CREATE ON SCHEMA public TO rusa_agent_worker")
            connection.execute("""
                DO $$rusa$$
                BEGIN
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rusa_knowledge_worker') THEN
                        EXECUTE 'CREATE ROLE rusa_knowledge_worker NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS';
                    END IF;
                END;
                $$rusa$$;
            """)
            connection.execute("ALTER ROLE rusa_agent_worker NOINHERIT")
            connection.execute(
                "GRANT rusa_knowledge_worker TO rusa_agent_worker WITH INHERIT FALSE"
            )
            connection.execute("GRANT USAGE ON SCHEMA public TO rusa_knowledge_worker")
            web_password = os.environ["RUSA_WEB_DB_PASSWORD"]
            web_role = connection.execute(
                "SELECT 1 FROM pg_roles WHERE rolname='rusa_web_api'"
            ).fetchone()
            if web_role:
                connection.execute(
                    sql.SQL(
                        "ALTER ROLE rusa_web_api WITH LOGIN PASSWORD {} "
                        "NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
                    ).format(sql.Literal(web_password))
                )
            else:
                connection.execute(
                    sql.SQL(
                        "CREATE ROLE rusa_web_api LOGIN PASSWORD {} "
                        "NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
                    ).format(sql.Literal(web_password))
                )
            connection.execute("GRANT CONNECT ON DATABASE rusa_agent TO rusa_web_api")
        dsn = os.environ["RUSA_AGENT_DATABASE_URL"]
        queue = PostgresTaskQueue(dsn)
        queue.initialize()
        PostgresMemoryStore(dsn).initialize()
        queue.configure_api_permissions()
        with psycopg.connect(owner_dsn) as connection:
            connection.autocommit = True
            migration = Path("/app/migrations/005_rag_knowledge_pgvector.sql").read_text(encoding="utf-8")
            connection.execute(migration, prepare=False)
            identity_migration = Path("/app/migrations/006_user_identity.sql").read_text(encoding="utf-8")
            connection.execute(identity_migration, prepare=False)
    restart: "no"
    environment:
      RUSA_AGENT_OWNER_DATABASE_URL: postgresql://rusa_agent_owner:${RUSA_AGENT_DB_PASSWORD:?Set RUSA_AGENT_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_DATABASE_URL: postgresql://rusa_agent_worker:${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_WEB_DB_PASSWORD: ${RUSA_WEB_DB_PASSWORD:?Set RUSA_WEB_DB_PASSWORD in .env}
    depends_on:
      rusa-agent-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

  rusa-agent-api:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rusa-agent-runtime:local
    command: ["uvicorn", "rusa_agents.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${RUSA_AGENT_PORT:-8001}:8001"
    environment:
      RUSA_AGENT_API_DATABASE_URL: postgresql://rusa_agent_api:${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_TENANT_KEYS: '${RUSA_AGENT_TENANT_KEYS:-}'
      RUSA_AGENT_ALLOWED_REPOSITORIES: ${RUSA_AGENT_ALLOWED_REPOSITORIES:-}
      RUSA_AGENT_TENANT_REPOSITORIES: '${RUSA_AGENT_TENANT_REPOSITORIES:-}'
      RUSA_AGENT_MAX_REQUEST_BYTES: ${RUSA_AGENT_MAX_REQUEST_BYTES:-262144}
      RUSA_AGENT_MAX_OUTSTANDING_PER_TENANT: ${RUSA_AGENT_MAX_OUTSTANDING_PER_TENANT:-1000}
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-worker:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rusa-agent-runtime:local
    command: ["python", "-m", "rusa_agents.worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 180s
    environment:
      RUSA_AGENT_DATABASE_URL: postgresql://rusa_agent_worker:${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_PROVIDER_BASE_URL: ${RUSA_AGENT_PROVIDER_BASE_URL:-}
      RUSA_AGENT_PROVIDER_API_KEY: ${RUSA_AGENT_PROVIDER_API_KEY:-}
      RUSA_AGENT_MODEL: ${RUSA_AGENT_MODEL:-}
      RUSA_AGENT_GITHUB_TOKEN: ${RUSA_AGENT_GITHUB_TOKEN:-}
      RUSA_AGENT_ALLOWED_REPOSITORIES: ${RUSA_AGENT_ALLOWED_REPOSITORIES:-}
      RUSA_AGENT_TENANT_REPOSITORIES: '${RUSA_AGENT_TENANT_REPOSITORIES:-}'
      RUSA_AGENT_AUDIT_KEY: ${RUSA_AGENT_AUDIT_KEY:?Set RUSA_AGENT_AUDIT_KEY in .env}
      RUSA_AGENT_AUDIT_PATH: /var/lib/rusa-agent/audit.jsonl
      RUSA_AGENT_PROVIDER_TIMEOUT: ${RUSA_AGENT_PROVIDER_TIMEOUT:-45}
      RUSA_AGENT_PROVIDER_MAX_RESPONSE_BYTES: ${RUSA_AGENT_PROVIDER_MAX_RESPONSE_BYTES:-2000000}
      RUSA_AGENT_GITHUB_MAX_RESPONSE_BYTES: ${RUSA_AGENT_GITHUB_MAX_RESPONSE_BYTES:-4000000}
      RUSA_AGENT_GITHUB_MAX_FILE_BYTES: ${RUSA_AGENT_GITHUB_MAX_FILE_BYTES:-1000000}
      RUSA_AGENT_GITHUB_MAX_DIFF_FILES: ${RUSA_AGENT_GITHUB_MAX_DIFF_FILES:-20}
      RUSA_AGENT_WORKER_TIMEOUT: ${RUSA_AGENT_WORKER_TIMEOUT:-120}
      RUSA_AGENT_MAX_REPAIR_CYCLES: ${RUSA_AGENT_MAX_REPAIR_CYCLES:-2}
      RUSA_AGENT_REQUIRED_CI_CHECKS: '${RUSA_AGENT_REQUIRED_CI_CHECKS:-["Lint, test, and audit dependencies","Build and smoke-test containers"]}'
      RUSA_AGENT_POLL_INTERVAL: ${RUSA_AGENT_POLL_INTERVAL:-1}
      RUSA_AGENT_LEASE_SECONDS: ${RUSA_AGENT_LEASE_SECONDS:-300}
      RUSA_AGENT_MAX_OUTSTANDING_PER_TENANT: ${RUSA_AGENT_MAX_OUTSTANDING_PER_TENANT:-1000}
      RUSA_RAG_ENABLED: ${RUSA_RAG_ENABLED:-false}
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_agent_worker:${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_KNOWLEDGE_DB_ROLE: rusa_knowledge_worker
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-text-embedding-3-small}
      RUSA_KNOWLEDGE_COLLECTION: ${RUSA_KNOWLEDGE_COLLECTION:-agent}
      RUSA_MCP_SERVER_URL: ${RUSA_MCP_SERVER_URL:-}
      RUSA_MCP_TENANT_TOKENS: '${RUSA_MCP_TENANT_TOKENS:-}'
      RUSA_MCP_INTERNAL_HTTP_HOSTS: ${RUSA_MCP_INTERNAL_HTTP_HOSTS:-rusa-mcp}
      RUSA_MCP_ALLOWED_TOOLS: ${RUSA_MCP_ALLOWED_TOOLS:-search_knowledge,get_document,list_collections}
    volumes:
      - rusa-agent-audit-data:/var/lib/rusa-agent
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "rusa_agents.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-db-backup:
    profiles: ["backup-once"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: rusa-agent-db-backup:local
    command: ["/app/scripts/postgres/backup.sh"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://rusa_agent_owner:${RUSA_AGENT_DB_PASSWORD:?Set RUSA_AGENT_DB_PASSWORD in .env}@rusa-agent-db:5432/rusa_agent
      BACKUP_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${RUSA_BACKUP_AGE_RECIPIENT:?Set RUSA_BACKUP_AGE_RECIPIENT in .env}
      BACKUP_RETENTION_DAYS: ${RUSA_BACKUP_RETENTION_DAYS:-30}
      RUSA_BACKUP_REQUIRE_REMOTE: ${RUSA_BACKUP_REQUIRE_REMOTE:-true}
      RUSA_BACKUP_S3_URI: ${RUSA_BACKUP_S3_URI:-}
      RUSA_BACKUP_S3_ENDPOINT: ${RUSA_BACKUP_S3_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - rusa-agent-db-backups:/backups
    depends_on:
      rusa-agent-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  rusa-agent-db-backup-scheduler:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: rusa-agent-db-backup:local
    command: ["/app/scripts/postgres/backup_scheduler.sh"]
    restart: unless-stopped
    stop_grace_period: ${RUSA_BACKUP_STOP_GRACE_PERIOD:-1h}
    environment:
      DATABASE_URL: postgresql://rusa_agent_owner:${RUSA_AGENT_DB_PASSWORD:?Set RUSA_AGENT_DB_PASSWORD in .env}@rusa-agent-db:5432/rusa_agent
      BACKUP_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${RUSA_BACKUP_AGE_RECIPIENT:?Set RUSA_BACKUP_AGE_RECIPIENT in .env}
      BACKUP_RETENTION_DAYS: ${RUSA_BACKUP_RETENTION_DAYS:-30}
      RUSA_BACKUP_INTERVAL_SECONDS: ${RUSA_BACKUP_INTERVAL_SECONDS:-3600}
      RUSA_BACKUP_RETRY_SECONDS: ${RUSA_BACKUP_RETRY_SECONDS:-300}
      RUSA_BACKUP_REQUIRE_REMOTE: ${RUSA_BACKUP_REQUIRE_REMOTE:-true}
      RUSA_BACKUP_S3_URI: ${RUSA_BACKUP_S3_URI:-}
      RUSA_BACKUP_S3_ENDPOINT: ${RUSA_BACKUP_S3_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - rusa-agent-db-backups:/backups
    depends_on:
      rusa-agent-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  rusa-mcp:
    profiles: ["knowledge"]
    build:
      context: .
      dockerfile: Dockerfile.rag-mcp
    image: rusa-knowledge-mcp:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RUSA_MCP_PORT:-8002}:8002"
    environment:
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_agent_api:${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-text-embedding-3-small}
      RUSA_MCP_TENANT_KEYS: '${RUSA_MCP_TENANT_KEYS:-}'
      RUSA_MCP_ALLOWED_HOSTS: ${RUSA_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,rusa-mcp,rusa-mcp:*}
      RUSA_MCP_PORT: "8002"
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rusa-agent-postgres-data:
  rusa-agent-audit-data:
  rusa-agent-db-backups:
