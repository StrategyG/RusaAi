services:
  rusa-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rusa-ai:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RUSA_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      RUSA_API_KEY: ${RUSA_API_KEY:?Set RUSA_API_KEY in .env}
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-ai-v1}
      RUSA_MODEL_PATH: /models
      RUSA_MAX_REQUEST_BYTES: ${RUSA_MAX_REQUEST_BYTES:-1048576}
      TASK_ENVELOPE_SCHEMA_PATH: /app/schemas/a2a/task-envelope.schema.json
    volumes:
      - type: bind
        source: ${RUSA_MODEL_DIR:?Set RUSA_MODEL_DIR in .env}
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusa_agent
      POSTGRES_USER: rusa_agent_owner
      POSTGRES_PASSWORD: ${RUSA_AGENT_DB_PASSWORD:?Set RUSA_AGENT_DB_PASSWORD in .env}
      RUSA_AGENT_WORKER_DB_PASSWORD: ${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD in .env}
      RUSA_AGENT_API_DB_PASSWORD: ${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD in .env}
    volumes:
      - rusa-agent-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init-agent-db.sh:/docker-entrypoint-initdb.d/10-init-agent-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rusa_agent_owner -d rusa_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  rusa-agent-api:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rusa-agent-runtime:local
    command: ["uvicorn", "rusa_agents.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RUSA_AGENT_PORT:-8001}:8001"
    environment:
      RUSA_AGENT_API_DATABASE_URL: postgresql://rusa_agent_api:${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_TENANT_KEYS: '${RUSA_AGENT_TENANT_KEYS:?Set RUSA_AGENT_TENANT_KEYS in .env}'
      RUSA_AGENT_TENANT_REPOSITORIES: '${RUSA_AGENT_TENANT_REPOSITORIES:?Set RUSA_AGENT_TENANT_REPOSITORIES in .env}'
      RUSA_AGENT_MAX_REQUEST_BYTES: ${RUSA_AGENT_MAX_REQUEST_BYTES:-262144}
    depends_on:
      rusa-agent-worker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rusa-agent-runtime:local
    command: ["python", "-m", "rusa_agents.worker"]
    restart: unless-stopped
    init: true
    environment:
      RUSA_AGENT_DATABASE_URL: postgresql://rusa_agent_worker:${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_AGENT_PROVIDER_BASE_URL: ${RUSA_AGENT_PROVIDER_BASE_URL:?Set RUSA_AGENT_PROVIDER_BASE_URL in .env}
      RUSA_AGENT_PROVIDER_API_KEY: ${RUSA_AGENT_PROVIDER_API_KEY:?Set RUSA_AGENT_PROVIDER_API_KEY in .env}
      RUSA_AGENT_MODEL: ${RUSA_AGENT_MODEL:?Set RUSA_AGENT_MODEL in .env}
      RUSA_AGENT_GITHUB_TOKEN: ${RUSA_AGENT_GITHUB_TOKEN:?Set RUSA_AGENT_GITHUB_TOKEN in .env}
      RUSA_AGENT_TENANT_REPOSITORIES: '${RUSA_AGENT_TENANT_REPOSITORIES:?Set RUSA_AGENT_TENANT_REPOSITORIES in .env}'
      RUSA_AGENT_AUDIT_KEY: ${RUSA_AGENT_AUDIT_KEY:?Set RUSA_AGENT_AUDIT_KEY in .env}
      RUSA_AGENT_AUDIT_PATH: /var/lib/rusa-agent/audit.jsonl
      RUSA_AGENT_PROVIDER_TIMEOUT: ${RUSA_AGENT_PROVIDER_TIMEOUT:-45}
      RUSA_AGENT_WORKER_TIMEOUT: ${RUSA_AGENT_WORKER_TIMEOUT:-120}
      RUSA_AGENT_MAX_REPAIR_CYCLES: ${RUSA_AGENT_MAX_REPAIR_CYCLES:-2}
      RUSA_AGENT_POLL_INTERVAL: ${RUSA_AGENT_POLL_INTERVAL:-1}
      RUSA_AGENT_QUEUE_LEASE_SECONDS: ${RUSA_AGENT_QUEUE_LEASE_SECONDS:-300}
      RUSA_AGENT_QUEUE_HEARTBEAT_SECONDS: ${RUSA_AGENT_QUEUE_HEARTBEAT_SECONDS:-60}
      RUSA_RAG_ENABLED: ${RUSA_RAG_ENABLED:-false}
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_agent_worker:${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_KNOWLEDGE_DB_ROLE: rusa_knowledge_worker
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-text-embedding-3-small}
      RUSA_KNOWLEDGE_COLLECTION: ${RUSA_KNOWLEDGE_COLLECTION:-agent}
      RUSA_MCP_SERVER_URL: ${RUSA_MCP_SERVER_URL:-}
      RUSA_MCP_INTERNAL_HTTP_HOSTS: ${RUSA_MCP_INTERNAL_HTTP_HOSTS:-rusa-mcp}
      RUSA_MCP_TENANT_TOKENS: '${RUSA_MCP_TENANT_TOKENS:-}'
      RUSA_MCP_ALLOWED_TOOLS: ${RUSA_MCP_ALLOWED_TOOLS:-search_knowledge,get_document,list_collections}
    volumes:
      - rusa-agent-audit-data:/var/lib/rusa-agent
    depends_on:
      rusa-agent-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "rusa_agents.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-mcp:
    profiles: ["knowledge"]
    build:
      context: .
      dockerfile: Dockerfile.rag-mcp
    image: rusa-knowledge-mcp:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RUSA_MCP_PORT:-8002}:8002"
    environment:
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_agent_api:${RUSA_AGENT_API_DB_PASSWORD:?Set RUSA_AGENT_API_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-text-embedding-3-small}
      RUSA_MCP_TENANT_KEYS: '${RUSA_MCP_TENANT_KEYS:?Set RUSA_MCP_TENANT_KEYS in .env}'
      RUSA_MCP_ALLOWED_HOSTS: "${RUSA_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,rusa-mcp,rusa-mcp:*}"
      RUSA_MCP_PORT: "8002"
    depends_on:
      rusa-agent-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-knowledge-migrate:
    profiles: ["migrate"]
    image: pgvector/pgvector:pg16
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/apply-rag-migration.sh"]
    environment:
      RUSA_AGENT_DB_PASSWORD: ${RUSA_AGENT_DB_PASSWORD:?Set RUSA_AGENT_DB_PASSWORD in .env}
      RUSA_AGENT_DB_HOST: rusa-agent-db
      RUSA_AGENT_DB_PORT: "5432"
      RUSA_AGENT_DB_NAME: rusa_agent
      RUSA_AGENT_DB_USER: rusa_agent_owner
    volumes:
      - ./scripts/postgres/apply-rag-migration.sh:/scripts/apply-rag-migration.sh:ro
      - ./migrations/005_rag_knowledge_pgvector.sql:/migrations/005_rag_knowledge_pgvector.sql:ro
    depends_on:
      rusa-agent-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32

volumes:
  rusa-agent-postgres-data:
  rusa-agent-audit-data:
