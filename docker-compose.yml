services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusa
      POSTGRES_USER: rusa
      POSTGRES_PASSWORD: ${RUSA_DB_PASSWORD:?Set RUSA_DB_PASSWORD in .env}
    volumes:
      - rusa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusa -d rusa"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  rusa-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rusa-ai:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RUSA_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      RUSA_API_KEY: ${RUSA_API_KEY:?Set RUSA_API_KEY in .env}
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-ai-v1}
      RUSA_MODEL_PATH: /models
      RUSA_MAX_REQUEST_BYTES: ${RUSA_MAX_REQUEST_BYTES:-1048576}
      TASK_ENVELOPE_SCHEMA_PATH: /app/schemas/a2a/task-envelope.schema.json
    volumes:
      - type: bind
        source: ${RUSA_MODEL_DIR:?Set RUSA_MODEL_DIR in .env}
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-migrate:
    image: rusa-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      RUSA_DATABASE_URL: postgresql+asyncpg://rusa:${RUSA_DB_PASSWORD}@postgres:5432/rusa
    depends_on:
      postgres:
        condition: service_healthy

  rusa-agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: rusa-agent:local
    restart: unless-stopped
    init: true
    command: ["uvicorn", "rusa_agents.api:app", "--host", "0.0.0.0", "--port", "8010", "--workers", "1"]
    ports:
      - "127.0.0.1:${RUSA_AGENT_PORT:-8010}:8010"
    environment:
      RUSA_DATABASE_URL: postgresql+asyncpg://rusa:${RUSA_DB_PASSWORD}@postgres:5432/rusa
      RUSA_DB_AUTO_CREATE: "false"
      RUSA_TENANT_API_KEYS: ${RUSA_TENANT_API_KEYS:?Set RUSA_TENANT_API_KEYS in .env}
      RUSA_TENANT_APPROVER_KEYS: ${RUSA_TENANT_APPROVER_KEYS:?Set RUSA_TENANT_APPROVER_KEYS in .env}
      RUSA_AGENT_MODEL_BASE_URL: http://rusa-api:8000/v1
      RUSA_AGENT_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-ai-v1}
      RUSA_AGENT_MODEL_API_KEY: ${RUSA_API_KEY:?Set RUSA_API_KEY in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set a least-privilege GITHUB_TOKEN in .env}
      RUSA_MCP_SERVERS: ${RUSA_MCP_SERVERS:-}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
      rusa-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rusa-agent-worker:
    image: rusa-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    init: true
    command: ["python", "-m", "rusa_agents.worker_cli"]
    environment:
      RUSA_DATABASE_URL: postgresql+asyncpg://rusa:${RUSA_DB_PASSWORD}@postgres:5432/rusa
      RUSA_DB_AUTO_CREATE: "false"
      RUSA_AGENT_MODEL_BASE_URL: http://rusa-api:8000/v1
      RUSA_AGENT_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-ai-v1}
      RUSA_AGENT_MODEL_API_KEY: ${RUSA_API_KEY:?Set RUSA_API_KEY in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set a least-privilege GITHUB_TOKEN in .env}
      RUSA_MCP_SERVERS: "${RUSA_MCP_SERVERS:-{}}"
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
      rusa-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rusa-postgres-data:
