services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusa
      POSTGRES_USER: rusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - rusa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusa -d rusa"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rusa-internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RUSA_DATABASE_URL: postgresql://rusa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rusa
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [rusa-internal, rusa-egress]

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "rusa_agents.worker_main"]
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      RUSA_DATABASE_URL: postgresql://rusa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rusa
      DOCKER_HOST: unix:///run/docker.sock
    volumes:
      - ${RUSA_DOCKER_SOCKET:?Set RUSA_DOCKER_SOCKET to a dedicated rootless Docker socket}:/run/docker.sock
      - ${RUSA_WORKSPACE_ROOT:?Set RUSA_WORKSPACE_ROOT}:${RUSA_WORKSPACE_ROOT}
      - ${RUSA_GIT_MIRROR_ROOT:?Set RUSA_GIT_MIRROR_ROOT}:${RUSA_GIT_MIRROR_ROOT}
    group_add:
      - "${RUSA_DOCKER_GID:-1001}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rusa-internal, rusa-egress]

volumes:
  rusa-postgres:

networks:
  rusa-internal:
    driver: bridge
    internal: true
  rusa-egress:
    driver: bridge
