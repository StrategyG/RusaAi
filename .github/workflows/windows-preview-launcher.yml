name: RUSA AI Windows Preview Launcher CI

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-preview-launcher.yml"
  push:
    branches: [main]
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-preview-launcher.yml"

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows preview launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "packaging/windows/Start-LocalPreview.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "PowerShell launcher syntax is valid."
