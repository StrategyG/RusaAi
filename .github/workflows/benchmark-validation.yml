name: RUSA-AI Benchmark Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "rusa_agents/benchmarking.py"
      - "scripts/benchmark_reasoning.py"
      - "scripts/benchmark_inference.py"
      - "llm-project/data/reasoning_smoke.jsonl"
      - "tests/test_benchmarking.py"
      - "docs/BENCHMARKING_V2.md"
      - ".github/workflows/benchmark-validation.yml"
  push:
    branches: [main]
    paths:
      - "rusa_agents/benchmarking.py"
      - "scripts/benchmark_reasoning.py"
      - "scripts/benchmark_inference.py"
      - "llm-project/data/reasoning_smoke.jsonl"
      - "tests/test_benchmarking.py"
      - "docs/BENCHMARKING_V2.md"
      - ".github/workflows/benchmark-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusa-benchmark-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-unit:
    name: Benchmark evaluator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile benchmark code
        run: python -m compileall -q rusa_agents scripts tests
      - name: Lint benchmark code
        run: ruff check rusa_agents/benchmarking.py scripts/benchmark_reasoning.py scripts/benchmark_inference.py tests/test_benchmarking.py
      - name: Validate reasoning dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.benchmark_reasoning import load_dataset

          dataset_path = Path("llm-project/data/reasoning_smoke.jsonl")
          cases = load_dataset(dataset_path)
          ids = [str(case["id"]).strip() for case in cases]
          assert len(ids) == len(set(ids)), "reasoning dataset IDs must be unique"
          for case in cases:
              assert str(case["category"]).strip(), f"case {case['id']} has an empty category"
              accepted = case["accepted_answers"]
              assert isinstance(accepted, list) and accepted, f"case {case['id']} needs accepted_answers"
              assert all(isinstance(answer, str) and answer.strip() for answer in accepted), (
                  f"case {case['id']} has invalid accepted_answers"
              )
          print(f"Validated {len(cases)} reasoning benchmark cases")
          PY
      - name: Test benchmark scoring
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_benchmarking.py --junitxml=artifacts/benchmark-unit-tests.xml
      - name: Generate commit-bound test evidence
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import sys
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          dataset_path = Path("llm-project/data/reasoning_smoke.jsonl")
          junit_path = Path("artifacts/benchmark-unit-tests.xml")
          root = ET.parse(junit_path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          evidence = {
              "schema_version": 1,
              "evidence_id": "RUSA-BENCHMARK-CI",
              "status": "PASS",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit_sha": os.environ["SOURCE_COMMIT_SHA"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "workflow_url": (
                      os.environ["GITHUB_SERVER_URL"] + "/" +
                      os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" +
                      os.environ["GITHUB_RUN_ID"]
                  ),
              },
              "runtime": {
                  "python": sys.version.split()[0],
                  "platform": platform.platform(),
              },
              "dataset": {
                  "path": str(dataset_path),
                  "sha256": hashlib.sha256(dataset_path.read_bytes()).hexdigest(),
                  "case_count": sum(
                      1 for line in dataset_path.read_text(encoding="utf-8").splitlines()
                      if line.strip() and not line.lstrip().startswith("#")
                  ),
              },
              "checks": {
                  "compile": "PASS",
                  "ruff": "PASS",
                  "dataset_validation": "PASS",
                  "unit_tests": {
                      "status": "PASS" if totals["failures"] == 0 and totals["errors"] == 0 and totals["skipped"] == 0 else "FAIL",
                      **totals,
                  },
              },
              "scope_limitations": [
                  "This evidence covers benchmark evaluator CI only.",
                  "It does not contain a live model reasoning score or inference load result.",
                  "It is not a production release approval or independent QA sign-off.",
              ],
          }
          if evidence["checks"]["unit_tests"]["status"] != "PASS":
              evidence["status"] = "FAIL"
          Path("test-evidence.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, ensure_ascii=False))
          PY
      - name: Upload commit-bound test evidence
        uses: actions/upload-artifact@v4
        with:
          name: rusa-benchmark-test-evidence-${{ github.run_id }}
          path: |
            test-evidence.json
            artifacts/benchmark-unit-tests.xml
          if-no-files-found: error
          retention-days: 90
