name: RUSA AI VS Code Extension CI

on:
  pull_request:
    paths:
      - "integrations/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches: [main]
    paths:
      - "integrations/vscode/**"
      - ".github/workflows/vscode-extension.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package.json
      - name: Install extension dependencies
        run: npm install --no-audit --no-fund
      - name: Compile extension
        run: npm run compile
      - name: Package VSIX
        run: npm run package
