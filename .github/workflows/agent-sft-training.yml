name: RUSA-AI Agent SFT GPU Training

on:
  workflow_dispatch:
    inputs:
      confirm_gpu_run:
        description: "Confirm this manually starts a Qwen3-4B QLoRA run on a self-hosted GPU runner."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rusa-agent-sft-training
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    if: inputs.confirm_gpu_run == true
    name: Train and evaluate QLoRA adapter
    runs-on: [self-hosted, linux, x64, cuda, gpu]
    environment: rusa-model-training
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dedicated training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-train.txt

      - name: Verify CUDA GPU capacity
        run: |
          nvidia-smi
          python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("A CUDA-enabled PyTorch runtime and NVIDIA GPU are required.")
          device = torch.cuda.current_device()
          props = torch.cuda.get_device_properties(device)
          vram_gib = props.total_memory / (1024 ** 3)
          print(f"GPU: {props.name}")
          print(f"VRAM: {vram_gib:.2f} GiB")
          if vram_gib < 24:
              raise SystemExit(
                  "The committed 4096-token QLoRA configuration requires the "
                  "documented recommended starting target of at least 24 GiB VRAM. "
                  "Use a separately reviewed lower-sequence-length configuration "
                  "for smaller GPUs."
              )
          PY

      - name: Validate curated dataset
        run: |
          python llm-project/train/validate_dataset.py \
            --train-file llm-project/data/curated/train.jsonl \
            --eval-file llm-project/data/curated/eval.jsonl

      - name: Train QLoRA adapter
        run: python llm-project/train/train_sft.py

      - name: Evaluate held-out agent contract and safety metrics
        run: |
          python llm-project/eval/evaluate_agent_sft.py \
            --adapter-dir artifacts/rusa-agent-qwen3-4b-qlora/adapter \
            --eval-file llm-project/data/curated/eval.jsonl \
            --config llm-project/configs/training.yaml \
            --output artifacts/agent-sft-evaluation.json

      - name: Add evaluation summary
        if: always()
        run: |
          if [ -f artifacts/agent-sft-evaluation.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/agent-sft-evaluation.json").read_text())
          metrics = report.get("metrics", {})
          print("## RUSA Agent SFT evaluation")
          print()
          print("| Metric | Result |")
          print("|---|---:|")
          for key in (
              "valid_json_rate",
              "valid_contract_rate",
              "blocked_recall",
              "blocked_precision",
              "blocked_false_positive_rate",
          ):
              value = metrics.get(key)
              print(f"| {key} | {value if value is not None else 'not available'} |")
          print()
          print("This is a candidate adapter evaluation, not production certification.")
          PY
          else
            echo "Training or evaluation did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload unpromoted training candidate and evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rusa-agent-sft-candidate-${{ github.run_id }}
          path: |
            artifacts/rusa-agent-qwen3-4b-qlora/adapter/
            artifacts/agent-sft-evaluation.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
