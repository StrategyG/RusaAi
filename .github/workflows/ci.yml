name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rusa_test
          POSTGRES_USER: rusa_test
          POSTGRES_PASSWORD: rusa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa_test -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSA_TEST_DATABASE_URL: postgresql://rusa_test:rusa_test_password@localhost:5432/rusa_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
            requirements-dev.txt

      - name: Install CPU-only PyTorch for CI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2,<3"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check llm-project/serve rusa_agents tests

      - name: Compile
        run: python -m compileall -q llm-project rusa_agents tests

      - name: Validate deployment shell scripts
        run: bash -n scripts/deploy/compose-deploy.sh scripts/deploy/compose-rollback.sh scripts/postgres/init-agent-db.sh

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Audit all Python dependencies
        run: pip-audit -r requirements-dev.txt

  container-security:
    name: Build, scan, and inventory containers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Validate Docker Compose configuration
        env:
          RUSA_API_KEY: ci-only-inference-key-123456789012345678901234567890
          RUSA_MODEL_DIR: .
          RUSA_API_IMAGE: rusa-ai:local
          RUSA_AGENT_IMAGE: rusa-agent-runtime:local
          RUSA_AGENT_DB_PASSWORD: ciownerpassword123456789
          RUSA_AGENT_WORKER_DB_PASSWORD: ciworkerpassword123456789
          RUSA_AGENT_API_DB_PASSWORD: ciapassword123456789
          RUSA_AGENT_TENANT_KEYS: '{"tenant-a":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          RUSA_AGENT_TENANT_REPOSITORIES: '{"tenant-a":["StrategyG/RusaAi"]}'
          RUSA_AGENT_PROVIDER_BASE_URL: https://provider.example.invalid/v1
          RUSA_AGENT_PROVIDER_API_KEY: ci-provider-placeholder
          RUSA_AGENT_MODEL: ci-model
          RUSA_AGENT_GITHUB_TOKEN: ci-github-placeholder
          RUSA_AGENT_AUDIT_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: docker compose config --quiet

      - name: Build inference API image
        run: docker build --pull --file Dockerfile --tag rusa-ai:${{ github.sha }} .

      - name: Build agent runtime image
        run: docker build --pull --file Dockerfile.worker --tag rusa-agent-runtime:${{ github.sha }} .

      - name: Scan inference API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-ai:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan agent runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-agent-runtime:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate inference API SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rusa-ai:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-inference-api.cdx.json
          artifact-name: sbom-inference-api-${{ github.sha }}
          syft-version: v1.57.0
          upload-artifact: true
          upload-release-assets: false

      - name: Generate agent runtime SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rusa-agent-runtime:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-agent-runtime.cdx.json
          artifact-name: sbom-agent-runtime-${{ github.sha }}
          syft-version: v1.57.0
          upload-artifact: true
          upload-release-assets: false

  release-gate:
    name: Release Gate
    if: always()
    needs:
      - quality
      - container-security
    runs-on: ubuntu-24.04
    steps:
      - name: Require every mandatory job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTAINER_RESULT: ${{ needs.container-security.result }}
        run: |
          printf 'Quality: %s\nContainer security: %s\n' "$QUALITY_RESULT" "$CONTAINER_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
