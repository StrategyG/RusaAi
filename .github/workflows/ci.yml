name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.100.0" \
            "pydantic>=2.0" \
            "jsonschema[format]>=4.17.0" \
            "httpx>=0.24.0" \
            "pytest>=7.3.0" \
            "flake8>=7.0,<8.0"

      - name: Lint application and tests
        run: |
          python -m flake8 \
            llm-project/serve/app.py \
            llm-project/tests/test_task_validation.py \
            --max-line-length=100 \
            --count \
            --show-source \
            --statistics

      - name: Compile Python package
        run: python -m compileall -q llm-project

      - name: Run tests
        run: python -m pytest -q llm-project/tests

  docker-build:
    name: Verify Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t rusa-ai:${{ github.sha }} .
