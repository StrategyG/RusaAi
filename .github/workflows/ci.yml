name: CI/CD Pipeline

on:
  push:
    branches: [ main, "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API security and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt flake8

      - name: Compile Python sources
        run: |
          python -m compileall -q llm-project tests scripts

      - name: Lint critical errors
        run: |
          flake8 llm-project tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        env:
          ENVIRONMENT: development
        run: pytest -q

  docker-build:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rusa-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
