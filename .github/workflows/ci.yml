name: RUSA-AI CI

on:
  push:
    branches: [main, feature/aicode-agent-enterprise]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint, and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rusa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      RUSA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rusa_test
      RUSA_AUDIT_HMAC_KEY: ci-only-test-audit-key-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q rusa_agents llm-project/serve tests
      - name: Lint
        run: ruff check rusa_agents tests llm-project/serve
      - name: Security static analysis
        run: bandit -q -r rusa_agents
      - name: Tests
        run: python -m pytest -q

  docker-build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull -t rusa-ai:${{ github.sha }} .
      - name: Build isolated agent sandbox image
        run: docker build --pull -f Dockerfile.agent-sandbox -t rusa-ai-agent-sandbox:${{ github.sha }} .
      - name: Build autonomous worker image
        run: docker build --pull -f Dockerfile.worker -t rusa-ai-worker:${{ github.sha }} .
