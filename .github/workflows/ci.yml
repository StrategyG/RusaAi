name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and audit dependencies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rusa_test
          POSTGRES_USER: rusa_test
          POSTGRES_PASSWORD: rusa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa_test -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSA_TEST_DATABASE_URL: postgresql://rusa_test:rusa_test_password@localhost:5432/rusa_test
      DATABASE_URL: postgresql://rusa_test:rusa_test_password@localhost:5432/rusa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
            requirements-rag-mcp.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-dev.txt
      - name: Lint
        run: ruff check llm-project/serve rusa_agents rusa_knowledge rusa_mcp scripts/postgres tests
      - name: Compile
        run: python -m compileall -q llm-project rusa_agents rusa_knowledge rusa_mcp scripts/postgres tests
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Validate PostgreSQL backup scripts
        run: bash -n scripts/postgres/*.sh
      - name: Run encrypted PostgreSQL backup and restore drill
        env:
          ADMIN_DATABASE_URL: postgresql://rusa_test:rusa_test_password@127.0.0.1:5432/rusa_test
          SOURCE_DATABASE_URL: postgresql://rusa_backup_ci:rusa_backup_ci_password_1234567890@127.0.0.1:5432/rusa_test
          RESTORE_DATABASE_URL: postgresql://rusa_test:rusa_test_password@127.0.0.1:5432/rusa_restore_test
          RESTORE_CONFIRM_DATABASE: rusa_restore_test
          RUSA_BACKUP_REQUIRE_REMOTE: "true"
          RUSA_BACKUP_S3_URI: s3://rusa-agent-ci-backups/drill
          RUSA_BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: rusa-ci-minio-user
          AWS_SECRET_ACCESS_KEY: rusa-ci-minio-secret-1234567890
        run: |
          docker run -d --name rusa-minio-ci --network host \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:9000/minio/health/live; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --max-time 3 http://127.0.0.1:9000/minio/health/live
          mkdir -p "$RUNNER_TEMP/rusa-agent-backups" "$RUNNER_TEMP/rusa-backup-drill"
          docker build --pull -f Dockerfile.backup -t rusa-agent-db-backup:dr .
          docker run --rm -i --network host --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/rusa-agent-backups:/backups" \
            -v "$RUNNER_TEMP/rusa-backup-drill:/drill" \
            -e ADMIN_DATABASE_URL \
            -e SOURCE_DATABASE_URL \
            -e RESTORE_DATABASE_URL \
            -e RESTORE_CONFIRM_DATABASE \
            -e RUSA_BACKUP_REQUIRE_REMOTE \
            -e RUSA_BACKUP_S3_URI \
            -e RUSA_BACKUP_S3_ENDPOINT \
            -e AWS_DEFAULT_REGION \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e BACKUP_DIR=/backups \
            -e BACKUP_AGE_IDENTITY_FILE=/drill/age-identity.txt \
            --entrypoint bash rusa-agent-db-backup:dr -euo pipefail -s <<'DRILL'
          age-keygen -o "$BACKUP_AGE_IDENTITY_FILE" 2>/dev/null
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y "$BACKUP_AGE_IDENTITY_FILE")"
          aws --endpoint-url "$RUSA_BACKUP_S3_ENDPOINT" s3 mb s3://rusa-agent-ci-backups --region "$AWS_DEFAULT_REGION"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rusa_backup_ci
              LOGIN PASSWORD 'rusa_backup_ci_password_1234567890'
              INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          GRANT pg_read_all_data TO rusa_backup_ci;
          GRANT CONNECT ON DATABASE rusa_test TO rusa_backup_ci;
          ALTER ROLE rusa_backup_ci SET default_transaction_read_only = on;
          CREATE TABLE IF NOT EXISTS public.rusa_drill_probe (
              id INTEGER PRIMARY KEY,
              value TEXT NOT NULL
          );
          TRUNCATE public.rusa_drill_probe;
          INSERT INTO public.rusa_drill_probe (id, value)
          VALUES (1, 'encrypted-restore-drill-ok');
          SQL
          role_flags="$(psql "$ADMIN_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN NOT rolsuper AND rolbypassrls THEN 'ok' ELSE 'bad' END FROM pg_roles WHERE rolname='rusa_backup_ci'")"
          test "$role_flags" = "ok"
          can_insert="$(psql "$ADMIN_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('rusa_backup_ci', 'public.rusa_drill_probe', 'INSERT')")"
          test "$can_insert" = "f"
          if psql "$SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.rusa_drill_probe (id, value) VALUES (2, 'must-not-write')" >/dev/null 2>&1; then
              echo "Backup role unexpectedly has write access" >&2
              exit 1
          fi
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE rusa_restore_test"
          bash /app/scripts/postgres/restore_drill.sh
          restored_value="$(psql "$RESTORE_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT value FROM public.rusa_drill_probe WHERE id=1")"
          test "$restored_value" = "encrypted-restore-drill-ok"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE rusa_restore_test"
          DRILL
      - name: Cleanup DR object storage
        if: always()
        run: docker rm -f rusa-minio-ci || true
      - name: Audit production dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-agent.txt
          pip-audit -r requirements-rag-mcp.txt

  container:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            docker compose config --quiet
            rm -f .env
          fi
      - name: Build inference API image
        run: docker build --pull -t rusa-ai:${{ github.sha }} .
      - name: Build agent runtime image
        run: docker build --pull -f Dockerfile.worker -t rusa-agent-runtime:${{ github.sha }} .
      - name: Build RAG and MCP image
        run: docker build --pull -f Dockerfile.rag-mcp -t rusa-knowledge-mcp:${{ github.sha }} .
      - name: Build user and admin workspace image
        run: docker build --pull -f apps/web/Dockerfile -t rusa-ai-web:${{ github.sha }} .
      - name: Build PostgreSQL backup utility image
        run: docker build --pull -f Dockerfile.backup -t rusa-agent-db-backup:${{ github.sha }} .
      - name: Smoke-test RAG and MCP imports
        run: |
          docker run --rm rusa-knowledge-mcp:${{ github.sha }} python -c "import rusa_knowledge.service, rusa_mcp.server; print('RAG and MCP imports ok')"
      - name: Smoke-test agent runtime imports
        run: |
          docker run --rm rusa-agent-runtime:${{ github.sha }} \
            python -c "import rusa_agents.api, rusa_agents.worker; print('agent runtime imports ok')"
      - name: Run MCP server container
        run: docker run -d --name rusa-mcp-ci -p 127.0.0.1:8002:8002 rusa-knowledge-mcp:${{ github.sha }}
      - name: Verify MCP server liveness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8002/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs rusa-mcp-ci
          exit 1
      - name: Run inference API container
        run: |
          docker run -d --init --restart unless-stopped --name rusa-ai-ci \
            -p 127.0.0.1:8000:8000 \
            -e RUSA_API_KEY=ci-only-test-key-123456789012345678901234567890 \
            rusa-ai:${{ github.sha }}
      - name: Verify liveness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs rusa-ai-ci
          exit 1
      - name: Verify inference process crash recovery
        run: |
          docker exec rusa-ai-ci python -c 'import os, signal; me = os.getpid(); pids = [int(item) for item in os.listdir("/proc") if item.isdigit() and int(item) > 1 and int(item) != me]; app_pid = next((pid for pid in pids if b"uvicorn" in open(f"/proc/{pid}/cmdline", "rb").read()), None); assert app_pid is not None, "uvicorn process not found"; os.kill(app_pid, signal.SIGKILL)' || true
          for attempt in $(seq 1 30); do
            restart_count="$(docker inspect --format '{{.RestartCount}}' rusa-ai-ci)"
            if [ "$restart_count" -ge 1 ] && curl --fail --silent --max-time 3 http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker inspect rusa-ai-ci
          docker logs rusa-ai-ci
          exit 1
      - name: Run web workspace container
        run: docker run -d --name rusa-web-ci -p 127.0.0.1:3000:8080 rusa-ai-web:${{ github.sha }}
      - name: Verify web workspace liveness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs rusa-web-ci
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f rusa-ai-ci rusa-web-ci rusa-mcp-ci || true
