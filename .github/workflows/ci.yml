name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: docker.io/library/postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
        env:
          POSTGRES_DB: rusa_test
          POSTGRES_USER: rusa_test
          POSTGRES_PASSWORD: rusa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa_test -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSA_TEST_DATABASE_URL: postgresql://rusa_test:rusa_test_password@localhost:5432/rusa_test
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
            requirements-dev.txt

      - name: Install CPU-only PyTorch for CI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2,<3"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check llm-project/serve rusa_agents tests

      - name: Compile
        run: python -m compileall -q llm-project rusa_agents tests

      - name: Validate time-bound Trivy exceptions
        run: python scripts/security/validate_trivy_exceptions.py

      - name: Validate deployment shell scripts
        run: bash -n scripts/deploy/compose-deploy.sh scripts/deploy/compose-rollback.sh scripts/postgres/init-agent-db.sh tests/test_deploy_scripts.sh

      - name: Test deployment and rollback behavior
        run: bash tests/test_deploy_scripts.sh

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Audit all Python dependencies
        run: pip-audit -r requirements-dev.txt

  container-security:
    name: Build and smoke-test containers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate Docker Compose configuration
        env:
          RUSA_API_KEY: ci-only-inference-key-123456789012345678901234567890
          RUSA_MODEL_DIR: .
          RUSA_API_IMAGE: rusa-ai:local
          RUSA_AGENT_IMAGE: rusa-agent-runtime:local
          RUSA_AGENT_DB_PASSWORD: ciownerpassword123456789
          RUSA_AGENT_WORKER_DB_PASSWORD: ciworkerpassword123456789
          RUSA_AGENT_API_DB_PASSWORD: ciapassword123456789
          RUSA_AGENT_TENANT_KEYS: '{"tenant-a":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          RUSA_AGENT_TENANT_REPOSITORIES: '{"tenant-a":["StrategyG/RusaAi"]}'
          RUSA_AGENT_PROVIDER_BASE_URL: https://provider.example.invalid/v1
          RUSA_AGENT_PROVIDER_API_KEY: ci-provider-placeholder
          RUSA_AGENT_MODEL: ci-model
          RUSA_AGENT_GITHUB_TOKEN: ci-github-placeholder
          RUSA_AGENT_AUDIT_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          docker compose config --quiet
          docker compose --file docker-compose.production.yml config --quiet

      - name: Build inference API image
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" --file Dockerfile --tag rusa-ai:${{ github.sha }} .

      - name: Build agent runtime image
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" --file Dockerfile.worker --tag rusa-agent-runtime:${{ github.sha }} .

      - name: Pull pinned PostgreSQL image
        run: docker pull docker.io/library/postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc

      - name: Checkout rollback baseline
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 1881dad952193cdc6bb8b9245fc293a997e553ac
          path: rollback-baseline
          persist-credentials: false

      - name: Build rollback baseline images
        run: |
          docker build --pull --label org.opencontainers.image.revision=1881dad952193cdc6bb8b9245fc293a997e553ac --file rollback-baseline/Dockerfile --tag rusa-ai:1881dad952193cdc6bb8b9245fc293a997e553ac rollback-baseline
          docker build --pull --label org.opencontainers.image.revision=1881dad952193cdc6bb8b9245fc293a997e553ac --file rollback-baseline/Dockerfile.worker --tag rusa-agent-runtime:1881dad952193cdc6bb8b9245fc293a997e553ac rollback-baseline

      - name: Exercise deployment and rollback with PostgreSQL
        env:
          RUSA_API_KEY: ci-only-inference-key-123456789012345678901234567890
          RUSA_MODEL_DIR: .
          RUSA_API_IMAGE: rusa-ai:${{ github.sha }}
          RUSA_AGENT_IMAGE: rusa-agent-runtime:${{ github.sha }}
          RUSA_AGENT_DB_PASSWORD: ciownerpassword123456789
          RUSA_AGENT_WORKER_DB_PASSWORD: ciworkerpassword123456789
          RUSA_AGENT_API_DB_PASSWORD: ciapassword123456789
          RUSA_AGENT_TENANT_KEYS: '{"tenant-a":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          RUSA_AGENT_TENANT_REPOSITORIES: '{"tenant-a":["StrategyG/RusaAi"]}'
          RUSA_AGENT_PROVIDER_BASE_URL: https://provider.example.invalid/v1
          RUSA_AGENT_PROVIDER_API_KEY: ci-provider-placeholder
          RUSA_AGENT_MODEL: ci-model
          RUSA_AGENT_GITHUB_TOKEN: ci-github-placeholder
          RUSA_AGENT_AUDIT_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: bash tests/smoke_release_stack.sh "$GITHUB_SHA" "1881dad952193cdc6bb8b9245fc293a997e553ac"

      - name: Block all CRITICAL inference API vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-ai:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL

      - name: Gate inference API HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-ai:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH

      - name: Export complete inference API vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-ai:${{ github.sha }}
          format: json
          output: trivy-inference-api-full.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Block all CRITICAL agent runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-agent-runtime:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL

      - name: Gate agent runtime HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-agent-runtime:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH

      - name: Export complete agent runtime vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rusa-agent-runtime:${{ github.sha }}
          format: json
          output: trivy-agent-runtime-full.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Block all CRITICAL PostgreSQL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL

      - name: Gate PostgreSQL HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: HIGH

      - name: Export complete PostgreSQL vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
          format: json
          output: trivy-postgres-full.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload complete vulnerability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-vulnerability-reports-${{ github.sha }}
          path: |
            trivy-inference-api-full.json
            trivy-agent-runtime-full.json
            trivy-postgres-full.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate inference API SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rusa-ai:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-inference-api.cdx.json
          artifact-name: sbom-inference-api-${{ github.sha }}
          syft-version: v1.57.0
          upload-artifact: true
          upload-release-assets: false

      - name: Generate agent runtime SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rusa-agent-runtime:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-agent-runtime.cdx.json
          artifact-name: sbom-agent-runtime-${{ github.sha }}
          syft-version: v1.57.0
          upload-artifact: true
          upload-release-assets: false

      - name: Generate PostgreSQL SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker.io/library/postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
          format: cyclonedx-json
          output-file: sbom-postgres.cdx.json
          artifact-name: sbom-postgres-${{ github.sha }}
          syft-version: v1.57.0
          upload-artifact: true
          upload-release-assets: false

  release-gate:
    name: Release Gate
    if: always()
    needs:
      - quality
      - container-security
    runs-on: ubuntu-24.04
    steps:
      - name: Require every mandatory job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTAINER_RESULT: ${{ needs.container-security.result }}
        run: |
          printf 'Quality: %s\nContainer security: %s\n' "$QUALITY_RESULT" "$CONTAINER_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
