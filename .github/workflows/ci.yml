name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and audit dependencies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rusa_test
          POSTGRES_USER: rusa_test
          POSTGRES_PASSWORD: rusa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa_test -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSA_TEST_DATABASE_URL: postgresql://rusa_test:rusa_test_password@localhost:5432/rusa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-dev.txt
      - name: Lint
        run: ruff check llm-project/serve rusa_agents tests
      - name: Compile
        run: python -m compileall -q llm-project rusa_agents tests
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Audit production dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-agent.txt

  container:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          RUSA_API_KEY: "ci-only-inference-key-123456789012345678901234567890"
          RUSA_MODEL_DIR: "/tmp/rusa-model"
          RUSA_AGENT_DB_PASSWORD: "ci-owner-db-password"
          RUSA_AGENT_WORKER_DB_PASSWORD: "ci-worker-db-password"
          RUSA_AGENT_API_DB_PASSWORD: "ci-api-db-password"
          RUSA_AGENT_TENANT_KEYS: '{"ci-tenant":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          RUSA_AGENT_PROVIDER_BASE_URL: "https://provider.example.invalid/v1"
          RUSA_AGENT_PROVIDER_API_KEY: "ci-only-provider-key"
          RUSA_AGENT_MODEL: "ci-placeholder-model"
          RUSA_AGENT_GITHUB_TOKEN: "ci-only-github-token"
          RUSA_AGENT_ALLOWED_REPOSITORIES: "StrategyG/RusaAi"
          RUSA_AGENT_AUDIT_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        run: docker compose config --quiet
      - name: Build inference API image
        run: docker build --pull -t rusa-ai:${{ github.sha }} .
      - name: Build agent runtime image
        run: docker build --pull -f Dockerfile.worker -t rusa-agent-runtime:${{ github.sha }} .
      - name: Smoke-test agent runtime imports
        run: |
          docker run --rm --entrypoint python rusa-agent-runtime:${{ github.sha }} -c "from rusa_agents.api import app; import rusa_agents.worker; assert app.title == 'RUSA-AI Agent API'"
      - name: Run inference API container
        run: |
          docker run -d --name rusa-ai-ci \
            -p 127.0.0.1:8000:8000 \
            -e RUSA_API_KEY=ci-only-test-key-123456789012345678901234567890 \
            rusa-ai:${{ github.sha }}
      - name: Verify liveness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs rusa-ai-ci
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f rusa-ai-ci || true
