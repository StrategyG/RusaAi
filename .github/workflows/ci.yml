name: RUSA-AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint, and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q rusa_agents llm-project/serve tests
      - name: Lint
        run: ruff check rusa_agents tests llm-project/serve
      - name: Security static analysis
        run: bandit -q -r rusa_agents
      - name: Tests
        run: python -m pytest -q

  docker-build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t rusa-ai:${{ github.sha }} .
