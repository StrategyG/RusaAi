name: Security and Regression CI

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Unit, Security and PostgreSQL RLS Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      RUSA_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rusa_test
      RUSA_TEST_DB_PASSWORD: ci-only-ephemeral
      RUSA_DATABASE_URL: postgresql://rusa_app:ci-only-ephemeral@localhost:5432/rusa_test
      RUSA_REDIS_URL: redis://localhost:6379/0
      RUSA_RATE_LIMIT_MAX_REQUESTS: "100"
      RUSA_RATE_LIMIT_WINDOW_SECONDS: "60"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 bandit pip-audit
      - name: Provision least-privilege database role and RLS
        run: |
          PGPASSWORD=postgres psql "$RUSA_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_tenant_records_rls.sql
          PGPASSWORD=postgres psql "$RUSA_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE rusa_app WITH PASSWORD '$RUSA_TEST_DB_PASSWORD';"
      - name: Compile and lint
        run: |
          python -m compileall -q llm-project tests
          flake8 llm-project/serve tests --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -q -r llm-project/serve
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements-model.txt --strict
      - name: Run regression and security tests
        run: pytest -q --strict-config --strict-markers

  docker-build:
    name: Build and scan production API image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull -t rusa-ai:ci .
      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, immutable commit
        with:
          image-ref: rusa-ai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
