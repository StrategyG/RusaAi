name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m flake8 llm-project/serve tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify lint gate rejects violations
        run: |
          probe="$(mktemp --suffix=.py)"
          printf 'def lint_probe():\n    return undefined_name\n' > "$probe"
          if python -m flake8 "$probe" --select=F821; then
            echo "Lint accepted an undefined name." >&2
            exit 1
          fi

      - name: Compile
        run: python -m compileall -q llm-project/serve tests

      - name: Run test suite
        run: python -m pytest tests/ -v

  docker-smoke:
    name: Build and smoke-test production container
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --pull -t rusa-ai:ci .

      - name: Smoke-test container startup, health, authentication, and A2A validation
        shell: bash
        run: |
          set -euo pipefail
          api_key="ci-only-test-secret-with-at-least-32-characters"
          docker run --detach --name rusa-ai-ci \
            --publish 127.0.0.1:8000:8000 \
            --env ENVIRONMENT=production \
            --env RUSA_API_KEY="$api_key" \
            rusa-ai:ci

          cleanup() {
            docker logs rusa-ai-ci || true
            docker rm --force rusa-ai-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/rusa-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          grep --quiet '"status":"healthy"' /tmp/rusa-health.json
          test "$(docker inspect --format '{{.Config.User}}' rusa-ai-ci)" = "app:app"

          cat > /tmp/rusa-validation.json <<'JSON'
          {
            "envelope": {
              "protocol_version": "1.0",
              "task_id": "123e4567-e89b-12d3-a456-426614174000",
              "message_id": "123e4567-e89b-12d3-a456-426614174001",
              "type": "task.create",
              "from": {"agent_id": "ci-client", "role": "human"},
              "to": {"agent_id": "rusa-orchestrator", "role": "rusa_orchestrator"},
              "created_at": "2026-11-06T12:00:00Z",
              "task": {
                "objective": "Container A2A smoke test",
                "acceptance_criteria": ["Envelope is accepted"],
                "repository": "StrategyG/RusaAi",
                "base_branch": "main",
                "work_branch": "fix/ci-smoke"
              },
              "policy": {
                "allowed_actions": ["read"],
                "prohibited_actions": ["deploy"],
                "human_approval_required": ["merge"]
              }
            }
          }
          JSON

          validation_status="$(curl --silent --output /tmp/rusa-validation-response.json --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8000/v1/validate-task \
            --header 'Content-Type: application/json' \
            --header "X-API-Key: $api_key" \
            --data-binary @/tmp/rusa-validation.json)"
          test "$validation_status" = "200"
          grep --quiet '"valid":true' /tmp/rusa-validation-response.json

          unauthenticated_status="$(curl --silent --output /tmp/rusa-unauth.json --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8000/v1/chat/completions \
            --header 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"smoke test"}]}')"
          test "$unauthenticated_status" = "401"

          authenticated_status="$(curl --silent --output /tmp/rusa-auth.json --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8000/v1/chat/completions \
            --header 'Content-Type: application/json' \
            --header "X-API-Key: $api_key" \
            --data '{"messages":[{"role":"user","content":"smoke test"}]}')"
          test "$authenticated_status" = "503"
          grep --quiet 'Inference backend is not configured' /tmp/rusa-auth.json
