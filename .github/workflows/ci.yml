name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check rusa_agents llm-project/serve tests
      - name: Compile
        run: python -m compileall -q rusa_agents llm-project tests
      - name: Security static analysis
        run: bandit -q -r rusa_agents
      - name: Test
        run: pytest -q
      - name: Audit core production dependencies
        run: pip-audit -r requirements.txt
      - name: Audit local-model production dependencies
        run: pip-audit -r requirements-model.txt

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API, model, and worker images
        run: |
          docker build --pull --target api -t rusa-ai-api:${{ github.sha }} .
          docker build --pull --target model-runtime -t rusa-ai-model:${{ github.sha }} .
          docker build --pull --target agent-runtime -t rusa-ai-agent:${{ github.sha }} .
      - name: Verify worker package imports
        run: |
          docker run --rm rusa-ai-agent:${{ github.sha }} \
            python -c "from rusa_agents.worker import run_worker; print('worker import ok')"
      - name: Run model-serving container
        run: |
          docker run -d --name rusa-ai-ci \
            -p 127.0.0.1:8000:8000 \
            -e RUSA_API_KEY=ci-only-test-key-123456789012345678901234567890 \
            rusa-ai-model:${{ github.sha }}
      - name: Verify application imports
        run: |
          docker exec rusa-ai-ci python -c "import app; import rusa_agents; print('application imports ok')"
      - name: Verify liveness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs rusa-ai-ci
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f rusa-ai-ci || true
