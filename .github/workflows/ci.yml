name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: rusa-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rusa_test
          POSTGRES_USER: rusa_test
          POSTGRES_PASSWORD: rusa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa_test -d rusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSA_TEST_DATABASE_URL: postgresql://rusa_test:rusa_test_password@localhost:5432/rusa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check llm-project/serve rusa_agents tests
      - name: Compile
        run: python -m compileall -q llm-project rusa_agents tests
      - name: Test
        run: pytest -q
      - name: Audit production dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-agent.txt

  container:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          export RUSA_API_KEY=ci-only-inference-key-123456789012345678901234567890
          export RUSA_MODEL_DIR=.
          export RUSA_AGENT_DB_PASSWORD=ciownerpassword123456789
          export RUSA_AGENT_WORKER_DB_PASSWORD=ciworkerpassword123456789
          export RUSA_AGENT_API_DB_PASSWORD=ciapipassword123456789
          export RUSA_AGENT_TENANT_KEYS='{"tenant-a":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          export RUSA_AGENT_TENANT_REPOSITORIES='{"tenant-a":["StrategyG/RusaAi"]}'
          export RUSA_AGENT_PROVIDER_BASE_URL=https://provider.example.invalid/v1
          export RUSA_AGENT_PROVIDER_API_KEY=ci-provider-placeholder
          export RUSA_AGENT_MODEL=ci-model
          export RUSA_AGENT_GITHUB_TOKEN=ci-github-placeholder
          export RUSA_AGENT_AUDIT_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          docker compose config --quiet
      - name: Build inference API image
        run: docker build --pull -t rusa-ai:${{ github.sha }} .
      - name: Build agent runtime image
        run: docker build --pull -f Dockerfile.worker -t rusa-agent-runtime:${{ github.sha }} .
      - name: Run inference API container
        run: |
          docker run -d --name rusa-ai-ci \
            -p 127.0.0.1:8000:8000 \
            -e RUSA_API_KEY=ci-only-test-key-123456789012345678901234567890 \
            rusa-ai:${{ github.sha }}
      - name: Verify liveness
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs rusa-ai-ci
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f rusa-ai-ci || true
