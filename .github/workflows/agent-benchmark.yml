name: Agent Evaluation Benchmark

on:
  push:
    branches: ["chore/agent-evaluation-benchmark", "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**", "fix/**"]
  workflow_dispatch:
    inputs:
      run_model_benchmark:
        description: "Run the optional real-provider benchmark (requires repository model secrets)"
        required: true
        type: boolean
        default: false
      repetitions:
        description: "Number of repetitions per scenario (1-100; use 10 for baseline candidate)"
        required: true
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: rusa-agent-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-benchmark:
    name: Deterministic agent regression benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSA_BENCHMARK_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - name: Install agent test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent.txt pytest pytest-asyncio ruff
      - name: Lint benchmark and runtime
        run: ruff check rusa_agents tests/test_benchmark_contract.py tests/test_agent_runtime.py benchmarks/run_deterministic.py benchmarks/run_model_benchmark.py
      - name: Compile benchmark and runtime
        run: python -m compileall -q rusa_agents benchmarks/run_deterministic.py benchmarks/run_model_benchmark.py tests/test_benchmark_contract.py tests/test_agent_runtime.py
      - name: Run deterministic benchmark gate
        run: PYTHONPATH=. python -m pytest -q tests/test_benchmark_contract.py tests/test_agent_runtime.py
      - name: Generate deterministic benchmark report
        run: PYTHONPATH=. python benchmarks/run_deterministic.py --output benchmark-report.json
      - name: Upload deterministic benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: benchmark-report.json
          if-no-files-found: ignore
          retention-days: 30

  model-benchmark:
    name: Repeated model-backed agent benchmark (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_benchmark == true
    needs: deterministic-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSA_AGENT_MODEL_BASE_URL: ${{ secrets.RUSA_AGENT_MODEL_BASE_URL }}
      RUSA_AGENT_MODEL_NAME: ${{ secrets.RUSA_AGENT_MODEL_NAME }}
      RUSA_AGENT_MODEL_API_KEY: ${{ secrets.RUSA_AGENT_MODEL_API_KEY }}
      RUSA_AGENT_MODEL_REVISION: ${{ secrets.RUSA_AGENT_MODEL_REVISION }}
      RUSA_AGENT_MODEL_INPUT_USD_PER_1M: ${{ secrets.RUSA_AGENT_MODEL_INPUT_USD_PER_1M }}
      RUSA_AGENT_MODEL_OUTPUT_USD_PER_1M: ${{ secrets.RUSA_AGENT_MODEL_OUTPUT_USD_PER_1M }}
      RUSA_POLICY_VERSION: rusa-autonomy-policy-v1
      RUSA_BENCHMARK_CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent.txt
      - name: Run repeated real-provider benchmark
        run: |
          python benchmarks/run_model_benchmark.py \
            --repetitions "${{ inputs.repetitions }}" \
            --report model-benchmark-report.json \
            --jsonl model-benchmark-attempts.jsonl
      - name: Upload model benchmark report and raw attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-benchmark-${{ github.sha }}
          path: |
            model-benchmark-report.json
            model-benchmark-attempts.jsonl
          if-no-files-found: ignore
          retention-days: 30
