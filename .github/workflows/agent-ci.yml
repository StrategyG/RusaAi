name: Agent Runtime CI
on:
  push:
    branches: ["feature/enterprise-agent-runtime-integration"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rusa-agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent.txt pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check rusa_agents tests
      - name: Compile
        run: python -m compileall -q rusa_agents tests
      - name: Test
        run: pytest -q
