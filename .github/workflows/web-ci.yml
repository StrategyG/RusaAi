name: RUSA AI Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/web-ci.yml"
      - "tests/test_deploy_scripts.sh"
      - "scripts/deploy/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusa-ai-web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Resolve and validate the committed web dependency lockfile
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload resolved web dependency lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-package-lock-${{ github.sha }}
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Build Next.js application
        working-directory: web
        env:
          RUSA_API_BASE_URL: http://127.0.0.1:8000
          RUSA_WEB_SESSION_SECRET: ci-only-session-secret-change-this-value-123456789
        run: npm run build
      - name: Build web container
        run: docker build --pull -f web/Dockerfile -t rusa-ai-web:${{ github.sha }} web
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflow and deployment scripts
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
          bash -n scripts/deploy/compose-deploy.sh scripts/deploy/compose-rollback.sh tests/test_deploy_scripts.sh
          bash tests/test_deploy_scripts.sh
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.70.0
        with:
          version: v0.70.0
          cache: true
      - name: Report CRITICAL and HIGH web image vulnerabilities
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --pkg-types os,library "rusa-ai-web:${{ github.sha }}"
      - name: Block fixable CRITICAL and HIGH web image vulnerabilities
        run: trivy image --scanners vuln --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH --pkg-types os,library "rusa-ai-web:${{ github.sha }}"
