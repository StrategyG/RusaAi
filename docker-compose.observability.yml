services:
  rusa-api:
    environment:
      RUSA_METRICS_BEARER_TOKEN: ${RUSA_METRICS_BEARER_TOKEN:?Set RUSA_METRICS_BEARER_TOKEN in .env}
      RUSA_DATABASE_SIZE_LIMIT_BYTES: ${RUSA_DATABASE_SIZE_LIMIT_BYTES:-10737418240}
      RUSA_OTEL_ENABLED: "true"
      RUSA_OTEL_LOGS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service"

  rusa-agent-migrate:
    environment:
      RUSA_MONITOR_DB_PASSWORD: ${RUSA_MONITOR_DB_PASSWORD:?Set RUSA_MONITOR_DB_PASSWORD in .env}

  rusa-agent-api:
    environment:
      RUSA_METRICS_BEARER_TOKEN: ${RUSA_METRICS_BEARER_TOKEN:?Set RUSA_METRICS_BEARER_TOKEN in .env}
      RUSA_OTEL_ENABLED: "true"
      RUSA_OTEL_LOGS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service"

  rusa-agent-worker:
    environment:
      RUSA_METRICS_ENABLED: "true"
      RUSA_WORKER_METRICS_PORT: "9100"
      RUSA_AGENT_METRICS_INTERVAL_SECONDS: ${RUSA_AGENT_METRICS_INTERVAL_SECONDS:-30}
      RUSA_OTEL_ENABLED: "true"
      RUSA_OTEL_LOGS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service"

  rusa-mcp:
    environment:
      RUSA_METRICS_BEARER_TOKEN: ${RUSA_METRICS_BEARER_TOKEN:?Set RUSA_METRICS_BEARER_TOKEN in .env}
      RUSA_OTEL_ENABLED: "true"
      RUSA_OTEL_LOGS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service"

  rusa-agent-db:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service"

  rusa-web:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    restart: unless-stopped
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - rusa-observability-loki-data:/loki
    security_opt:
      - no-new-privileges:true

  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    restart: unless-stopped
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - rusa-observability-tempo-data:/var/tempo
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:${RUSA_ALERTMANAGER_PORT:-9093}
    ports:
      - "127.0.0.1:${RUSA_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - rusa-observability-alertmanager-data:/alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["observability"]
    environment:
      DATA_SOURCE_URI: rusa-agent-db:5432/rusa_agent?sslmode=disable
      DATA_SOURCE_USER: rusa_monitor
      DATA_SOURCE_PASS: ${RUSA_MONITOR_DB_PASSWORD:?Set RUSA_MONITOR_DB_PASSWORD in .env}
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true

  node-exporter:
    image: prom/node-exporter:v1.9.0
    profiles: ["observability"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: ["observability"]
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true

  pushgateway:
    image: prom/pushgateway:v1.10.0
    profiles: ["observability"]
    command:
      - --persistence.file=/data/pushgateway.data
      - --persistence.interval=1m
    volumes:
      - rusa-observability-pushgateway-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${RUSA_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/prometheus/targets:/etc/prometheus/targets:ro
      - rusa-observability-prometheus-data:/prometheus
    secrets:
      - rusa_metrics_token
    depends_on:
      - otel-collector
      - postgres-exporter
      - node-exporter
      - cadvisor
      - pushgateway
      - alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:${RUSA_GRAFANA_PORT:-3001}:3000"
    volumes:
      - rusa-observability-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rusa-alert-sink:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rusa-observability-alert-sink:local
    profiles: ["observability"]
    command:
      - uvicorn
      - rusa_observability.alert_sink:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
    environment:
      RUSA_ALERT_WEBHOOK_URL: ${RUSA_ALERT_WEBHOOK_URL:-}
      RUSA_ALERT_WEBHOOK_BEARER_TOKEN: ${RUSA_ALERT_WEBHOOK_BEARER_TOKEN:-}
      RUSA_OTEL_ENABLED: "true"
      RUSA_OTEL_LOGS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64

  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    profiles: ["gpu"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rusa-rag-evaluation:
    build:
      context: .
      dockerfile: Dockerfile.rag-mcp
    image: rusa-knowledge-mcp:local
    profiles: ["rag-evaluation"]
    command:
      - sh
      - -c
      - |
        while true; do
          python -m rusa_knowledge.evaluation_cli
          status=$$?
          if [ $$status -eq 2 ]; then
            echo "RAG evaluation completed below the configured Recall@k threshold"
          elif [ $$status -ne 0 ]; then
            echo "RAG evaluation failed; retrying after the configured interval"
          fi
          sleep "$${RUSA_RAG_EVAL_INTERVAL_SECONDS:-86400}"
        done
    environment:
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_agent_worker:${RUSA_AGENT_WORKER_DB_PASSWORD:?Set RUSA_AGENT_WORKER_DB_PASSWORD}@rusa-agent-db:5432/rusa_agent
      RUSA_KNOWLEDGE_DB_ROLE: rusa_knowledge_worker
      RUSA_EMBEDDING_BASE_URL: ${RUSA_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      RUSA_EMBEDDING_API_KEY: ${RUSA_EMBEDDING_API_KEY:-}
      RUSA_EMBEDDING_MODEL: ${RUSA_EMBEDDING_MODEL:-text-embedding-3-small}
      RUSA_KNOWLEDGE_COLLECTION: ${RUSA_KNOWLEDGE_COLLECTION:-agent}
      RUSA_RAG_EVAL_TENANT_ID: ${RUSA_RAG_EVAL_TENANT_ID:-}
      RUSA_RAG_EVAL_DATASET: /var/lib/rusa-eval/dataset.jsonl
      RUSA_RAG_MIN_RECALL_AT_K: ${RUSA_RAG_MIN_RECALL_AT_K:-0.80}
      RUSA_PROMETHEUS_PUSHGATEWAY: http://pushgateway:9091
      RUSA_RAG_EVAL_INTERVAL_SECONDS: ${RUSA_RAG_EVAL_INTERVAL_SECONDS:-86400}
    volumes:
      - ./evaluation:/var/lib/rusa-eval:ro
    depends_on:
      rusa-agent-migrate:
        condition: service_completed_successfully
      pushgateway:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

secrets:
  rusa_metrics_token:
    file: ${RUSA_METRICS_TOKEN_FILE:-./secrets/rusa-metrics-token.example}

volumes:
  rusa-observability-prometheus-data:
  rusa-observability-grafana-data:
  rusa-observability-loki-data:
  rusa-observability-tempo-data:
  rusa-observability-alertmanager-data:
  rusa-observability-pushgateway-data:
