error_log /dev/stderr notice;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rusa_api http://rusa-api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    access_log /dev/stdout;

    # Liveness is local to Nginx and must not depend on Docker DNS or API health.
    # Compose controls readiness by starting this service after rusa-api is healthy.
    location = /health/live {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok"}';
    }

    # Readiness checks the upstream API; this is meaningful only on the Compose network.
    location = /health/ready {
        proxy_pass $rusa_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass $rusa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"rusa-web"}';
    }

    location /health/ {
        proxy_pass $rusa_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
