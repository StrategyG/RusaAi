global:
  resolve_timeout: 5m

route:
  receiver: rusa-alert-sink
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: rusa-alert-sink
      repeat_interval: 1h

receivers:
  - name: rusa-alert-sink
    webhook_configs:
      - url: http://rusa-alert-sink:8080/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
