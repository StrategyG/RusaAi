services:
  rag-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusa_knowledge
      POSTGRES_USER: rusa_admin
      POSTGRES_PASSWORD: ${RUSA_RAG_ADMIN_PASSWORD:?Set RUSA_RAG_ADMIN_PASSWORD}
      RUSA_RAG_DB_PASSWORD: ${RUSA_RAG_DB_PASSWORD:?Set RUSA_RAG_DB_PASSWORD}
    volumes:
      - rusa-rag-data:/var/lib/postgresql/data
      - ./scripts/rag-db-init.sh:/docker-entrypoint-initdb.d/001-rag-db-init.sh:ro
      - ./scripts/rag-db-bootstrap.sql:/opt/rusa/rag-db-bootstrap.sql:ro
      - ./migrations/007_rag_knowledge_pgvector.sql:/opt/rusa/migrations/007_rag_knowledge_pgvector.sql:ro
      - ./migrations/008_rag_embedding_profiles.sql:/opt/rusa/migrations/008_rag_embedding_profiles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusa_admin -d rusa_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    networks: [rusa-rag-internal]

  ollama:
    image: rusa-ai-ollama-bge-m3:local
    build:
      context: .
      dockerfile: Dockerfile.ollama-model
    restart: unless-stopped
    init: true
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - rusa-ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    networks: [rusa-rag-internal]

  rag-mcp:
    image: rusa-ai-rag-mcp:local
    build:
      context: .
      dockerfile: Dockerfile.rag-mcp
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      RUSA_KNOWLEDGE_DATABASE_URL: postgresql://rusa_rag_runtime:${RUSA_RAG_DB_PASSWORD:?Set RUSA_RAG_DB_PASSWORD}@rag-db:5432/rusa_knowledge
      RUSA_KNOWLEDGE_DB_ROLE: rusa_knowledge_worker
      RUSA_KNOWLEDGE_DB_POOL_MIN: "1"
      RUSA_KNOWLEDGE_DB_POOL_MAX: "8"
      RUSA_MCP_TENANT_KEYS: ${RUSA_MCP_TENANT_KEYS:?Set SHA-256 tenant key registry}
      RUSA_MCP_ALLOWED_HOSTS: "localhost,localhost:8002,127.0.0.1,127.0.0.1:8002,rag-mcp,rag-mcp:8002"
      RUSA_MCP_REQUESTS_PER_MINUTE: "120"
      RUSA_EMBEDDING_PROVIDER: ollama
      RUSA_EMBEDDING_BASE_URL: http://ollama:11434
      RUSA_EMBEDDING_ALLOWED_HOSTS: ollama
      RUSA_EMBEDDING_MODEL: bge-m3
      RUSA_EMBEDDING_NATIVE_DIMENSIONS: "1024"
      RUSA_EMBEDDING_TIMEOUT: "60"
      RUSA_EMBEDDING_MAX_RETRIES: "2"
      RUSA_RAG_VECTOR_WEIGHT: "0.7"
      RUSA_RAG_LEXICAL_WEIGHT: "0.3"
      RUSA_RAG_HNSW_EF_SEARCH: "80"
    volumes:
      - ${RUSA_KNOWLEDGE_INPUT_DIR:-./knowledge-input}:/data/knowledge:ro
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      rag-db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    networks: [rusa-rag-internal]

networks:
  rusa-rag-internal:
    driver: bridge
    internal: true

volumes:
  rusa-rag-data:
  rusa-ollama-models:
