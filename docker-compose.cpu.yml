services:
  api:
    environment:
      RUSA_MODEL_BASE_URL: http://llama-cpp:8080/v1
      RUSA_LOCAL_MODEL_PATH: ""
      RUSA_MODEL_PATH: ""
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusaai-cpu-smoke-test}
      RUSA_MAX_CONCURRENT_INFERENCES: ${RUSA_MAX_CONCURRENT_INFERENCES:-1}
      RUSA_MAX_WAITING_INFERENCES: ${RUSA_MAX_WAITING_INFERENCES:-3}
      RUSA_INFERENCE_QUEUE_TIMEOUT_SECONDS: ${RUSA_INFERENCE_QUEUE_TIMEOUT_SECONDS:-60}
      RUSA_GENERATION_TIMEOUT_SECONDS: ${RUSA_GENERATION_TIMEOUT_SECONDS:-300}
      RUSA_MODEL_API_KEY: ""
      RUSA_MODEL_HEALTH_URL: http://llama-cpp:8080/health
      RUSA_MODEL_TELEMETRY_URL: http://model-telemetry:9101/v1/telemetry
      RUSA_MODEL_TELEMETRY_API_KEY: ${RUSA_MODEL_TELEMETRY_API_KEY:?Set model telemetry API key in .env}
      RUSA_MODEL_ARTIFACT_SHA256: ${RUSA_GGUF_MODEL_SHA256:-}
    depends_on:
      llama-cpp:
        condition: service_started
      model-telemetry:
        condition: service_started
    healthcheck:
      start_period: 10m

  worker:
    environment:
      # Development/staging path: all agent inference passes through the API
      # gateway so API and worker calls share its bounded admission controller.
      RUSA_WORKER_INFERENCE_BASE_URL: http://api:8000/v1
      RUSA_WORKER_INFERENCE_GATEWAY: "true"
      RUSA_WORKER_INFERENCE_CONTRACT: "false"
      RUSA_WORKER_INFERENCE_CONTRACT_URL: ""
      RUSA_WORKER_INFERENCE_API_KEYS: ${RUSA_WORKER_INFERENCE_API_KEYS:?Set tenant-scoped worker inference API keys in .env}
      RUSA_WORKER_INFERENCE_DEADLINE_MS: ${RUSA_WORKER_INFERENCE_DEADLINE_MS:-270000}
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusaai-cpu-smoke-test}
      RUSA_MODEL_API_KEY: ""
      RUSA_MAX_PARALLEL_WORKERS: ${RUSA_MAX_PARALLEL_WORKERS:-1}
    depends_on:
      llama-cpp:
        condition: service_started
      api:
        condition: service_healthy
  model-telemetry:
    build:
      context: .
      dockerfile: Dockerfile.model-telemetry
    restart: unless-stopped
    pid: "service:llama-cpp"
    environment:
      RUSA_MODEL_TELEMETRY_BIND: 0.0.0.0
      RUSA_MODEL_TELEMETRY_PORT: "9101"
      RUSA_MODEL_TELEMETRY_PROCESS_NAME: llama-server
      RUSA_MODEL_TELEMETRY_API_KEY: ${RUSA_MODEL_TELEMETRY_API_KEY:?Set model telemetry API key in .env}
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusaai-cpu-smoke-test}
      RUSA_MODEL_ARTIFACT_PATH: /models/model.gguf
      RUSA_MODEL_ARTIFACT_SHA256: ${RUSA_GGUF_MODEL_SHA256:-}
    volumes:
      - "${RUSA_GGUF_MODEL_PATH:?Set RUSA_GGUF_MODEL_PATH in .env}:/models/model.gguf:ro"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    expose: ["9101"]
    depends_on:
      llama-cpp:
        condition: service_started
    networks: [rusa-internal]

  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    init: true
    command:
      - --model
      - /models/model.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${RUSA_MODEL_CONTEXT:-4096}"
      - --threads
      - "${RUSA_CPU_THREADS:-4}"
      - --threads-batch
      - "${RUSA_CPU_THREADS:-4}"
      - --batch-size
      - "128"
      - --ubatch-size
      - "64"
      - --threads-http
      - "2"
      - --parallel
      - "${RUSA_MODEL_PARALLEL:-1}"
      - --n-gpu-layers
      - "0"
      - --alias
      - "${RUSA_MODEL_NAME:-rusaai-cpu-smoke-test}"
    volumes:
      - "${RUSA_GGUF_MODEL_PATH:?Set RUSA_GGUF_MODEL_PATH in .env}:/models/model.gguf:ro"
    expose:
      - "8080"
    mem_limit: ${RUSA_MODEL_MEMORY_LIMIT:-8g}
    cpus: ${RUSA_MODEL_CPU_LIMIT:-4.0}
    pids_limit: 128
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    networks: [rusa-internal]
