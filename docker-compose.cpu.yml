services:
  api:
    environment:
      # RusaModels owns GGUF artifacts, llama.cpp and model residency.
      # RusaAi owns the tenant-aware Control Plane and its bounded gateway.
      RUSA_MODEL_BASE_URL: ${RUSA_MODEL_BASE_URL:?Set RUSA_MODEL_BASE_URL to the RusaModels /openai/v1 endpoint}
      RUSA_LOCAL_MODEL_PATH: ""
      RUSA_MODEL_PATH: ""
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-general-4b}
      RUSA_MAX_CONCURRENT_INFERENCES: ${RUSA_MAX_CONCURRENT_INFERENCES:-1}
      RUSA_MAX_WAITING_INFERENCES: ${RUSA_MAX_WAITING_INFERENCES:-3}
      RUSA_INFERENCE_QUEUE_TIMEOUT_SECONDS: ${RUSA_INFERENCE_QUEUE_TIMEOUT_SECONDS:-60}
      RUSA_GENERATION_TIMEOUT_SECONDS: ${RUSA_GENERATION_TIMEOUT_SECONDS:-300}
      RUSA_MODEL_API_KEY: ${RUSA_MODEL_API_KEY:?Set RUSA_MODEL_API_KEY to a dedicated RusaModels inference-role token}
    healthcheck:
      start_period: 10m

  worker:
    environment:
      # Worker -> RusaAi gateway -> RusaModels Model Server -> private runtime.
      # The worker never receives the RusaModels inference token.
      RUSA_WORKER_INFERENCE_BASE_URL: http://api:8000/v1
      RUSA_WORKER_INFERENCE_GATEWAY: "true"
      RUSA_WORKER_INFERENCE_API_KEYS: ${RUSA_WORKER_INFERENCE_API_KEYS:?Set tenant-scoped worker inference API keys in .env}
      RUSA_WORKER_INFERENCE_DEADLINE_MS: ${RUSA_WORKER_INFERENCE_DEADLINE_MS:-270000}
      RUSA_MODEL_NAME: ${RUSA_MODEL_NAME:-rusa-general-4b}
      RUSA_MODEL_API_KEY: ""
      RUSA_MAX_PARALLEL_WORKERS: ${RUSA_MAX_PARALLEL_WORKERS:-1}
    depends_on:
      api:
        condition: service_healthy
